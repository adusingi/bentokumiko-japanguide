server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /404.html { internal; }
  location = /fr/404.html {
    internal;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location = /fr {
    return 308 /fr/;
  }

  # ^~ keeps French .html misses out of the generic English HTML location below.
  location ^~ /fr/ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    error_page 404 /fr/404.html;
    try_files $uri $uri/ =404;
  }

  location ~* ^/assets/images/.*\.(?:jpg|jpeg|png|webp|svg)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location ~* ^/assets/.*\.(?:css|js|svg)$ {
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location ~* \.html$ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
