name: checks

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@22
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm cloudflare:dry-run
      - run: docker build --build-arg TALLY_FORM_ID=abc123 --tag bento-kumiko-check .
